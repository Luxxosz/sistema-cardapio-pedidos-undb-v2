spring.application.name=tarrafa

# Le o .env da raiz do projeto ou da pasta backend
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Banco de dados Neon
# As tabelas ja foram criadas pelo schema.sql
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Configuracao do pool de conexoes
# O Neon pode suspender o banco quando fica parado
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=240000

# JWT
# O segredo precisa ter pelo menos 32 caracteres
jwt.secret=${JWT_SECRET}
jwt.expiracao=86400000

# Conta fixa do administrador
admin.email=${ADMIN_EMAIL}
admin.senha=${ADMIN_SENHA}

# Porta utilizada pelo Render
server.port=${PORT:8080}

# Origens autorizadas a acessar a API
# Inclui o frontend publicado na Vercel e os ambientes locais
app.cors.origens=${CORS_ORIGENS:http://localhost:*,https://tarrafa-bistro.vercel.app}
```